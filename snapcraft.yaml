name: mistral-desktop
version: '1.0.0'
summary: Desktop client for Mistral AI
description: |
  An unofficial desktop client for Mistral AI, providing a seamless desktop experience on Ubuntu.

base: core24
confinement: strict
grade: stable

apps:
  mistral-desktop:
    command: bin/main.py
    desktop: meta/gui/mistral-desktop.desktop
    plugs:
      - network
      - network-bind
      - x11
      - wayland
      - desktop
      - desktop-legacy
      - opengl
      - pulseaudio

parts:
  mistral-desktop:
    plugin: python
    source: .
    python-packages:
      - PySide6>=6.0.0
    stage-packages:
      - libgl1
      - libx11-6
      - libxext6
      - libxrender1
      - libxi6
      - libdbus-1-3
      - libxcb-cursor0
      - libxkbcommon-x11-0
      - libfontconfig1
      - libfreetype6
      - libssl3
