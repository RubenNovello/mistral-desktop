name: mistral-desktop
title: Mistral Desktop (unofficial)
summary: Client desktop non ufficiale per Mistral AI — Ollama locale o API
description: |
  Chat con i modelli Mistral direttamente dal desktop.
  Due motori selezionabili: Ollama locale (gratis, privacy, offline)
  oppure API Mistral. Client community, non affiliato a Mistral AI.
  Made in Italy 🇮🇹, con l'IA della Francia 🇫🇷, per tutta l'Europa 🇪🇺.
license: MIT
base: core22
grade: stable
confinement: strict
version: '0.1.1'
# NOTA: prima del publish nello store aggiungi snap/gui/icon.png (512x512)
# snapcraft la userà automaticamente come icona dello snap.

apps:
  mistral-desktop:
    command: bin/mistral-desktop
    desktop: snap/gui/mistral-desktop.desktop
    plugs:
      - home
      - network
      - network-bind
      - wayland
      - x11
      - opengl
      - desktop
      - desktop-legacy

parts:
  # script principale dell'app
  app-script:
    plugin: dump
    source: .
    stage:
      - mistral_desktop.py

  # ambiente Python con PySide6 + requests
  python-deps:
    plugin: python
    source: .
    python-packages:
      - PySide6
      - requests
    stage-packages:
      - libxcb-cursor0
      - libxcb-xinerama0
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-randr0
      - libxcb-render-util0
      - libxcb-shape0
      - libxcb-xkb1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libgl1
      - libegl1
      - libfontconfig1
      - libglib2.0-0
      - libdbus-1-3

  # launcher
  launcher:
    plugin: dump
    source: snap/launcher
    organize:
      mistral-desktop: bin/mistral-desktop

  # NOTA fase 2: aggiungere il core Rust con il plugin `rust` + maturin
