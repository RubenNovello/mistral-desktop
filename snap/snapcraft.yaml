name: mistral-desktop
title: Mistral Desktop (unofficial)
summary: Client desktop non ufficiale per Mistral AI
description: |
  La chat di Mistral AI in una finestra dedicata sul tuo desktop.
  Accedi una volta sola (Google, Apple o email) e la sessione resta
  salvata, come nel browser. Nessun telemetry: è solo una finestra
  che parla con chat.mistral.ai. Client community, non affiliato
  a Mistral AI.
  Made in Italy 🇮🇹, con l'IA della Francia 🇫🇷, per tutta l'Europa 🇪🇺.
license: MIT
icon: snap/gui/icon.png
base: core22
grade: stable
confinement: strict
version: '1.0.3'

apps:
  mistral-desktop:
    command: bin/mistral-desktop
    extensions: [gnome]
    desktop: snap/gui/mistral-desktop.desktop
    plugs:
      - home
      - network
      - network-bind
      - opengl

parts:
  # script principale dell'app
  app-script:
    plugin: dump
    source: .
    stage:
      - main.py

  # ambiente Python con PySide6 + requests
  python-deps:
    plugin: python
    source: .
    python-packages:
      - PySide6
      - requests
    stage-packages:
      - libxcb-cursor0
      - libxcb-xinerama0
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-randr0
      - libxcb-render-util0
      - libxcb-shape0
      - libxcb-xkb1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libfontconfig1
      - libglib2.0-0
      - libdbus-1-3
      - libnss3
      - libasound2
      - libxkbfile1
      - libxss1
      - libatk-bridge2.0-0
      - libatspi2.0-0
      - libgbm1
      - libxcomposite1
      - libxdamage1
      - libxfixes3
      - libxrandr2
      - libxslt1.1

  # launcher
  launcher:
    plugin: dump
    source: snap/local/launcher
    organize:
      mistral-desktop: bin/mistral-desktop