name: mistral-desktop
title: Mistral Desktop (unofficial)
summary: Client desktop non ufficiale per Mistral AI — Ollama locale o API
description: |
  Chat con i modelli Mistral direttamente dal desktop.
  Due motori selezionabili: Ollama locale (gratis, privacy, offline)
  oppure API Mistral. Client community, non affiliato a Mistral AI.
  Made in Italy 🇮🇹, con l'IA della Francia 🇫🇷, per tutta l'Europa 🇪🇺.
license: MIT
base: core22
grade: stable
confinement: strict
version: '1.0.0'

apps:
  mistral-desktop:
    command: bin/mistral-desktop
    extensions: [gnome]
    desktop: snap/gui/mistral-desktop.desktop
    plugs:
      - home
      - network
      - network-bind
      - opengl

parts:
  # script principale dell'app
  app-script:
    plugin: dump
    source: .
    stage:
      - main.py

  # ambiente Python con PySide6 + requests
  python-deps:
    plugin: python
    source: .
    python-packages:
      - PySide6
      - requests
    stage-packages:
      - libxcb-cursor0
      - libxcb-xinerama0
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-randr0
      - libxcb-render-util0
      - libxcb-shape0
      - libxcb-xkb1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libgl1
      - libegl1
      - libfontconfig1
      - libglib2.0-0
      - libdbus-1-3
      - libnss3
      - libasound2
      - libxkbfile1
      - libxss1
      - libatk-bridge2.0-0
      - libatspi2.0-0
      - libgbm1
      - libxcomposite1
      - libxdamage1
      - libxfixes3
      - libxrandr2
      - libxslt1.1

  # launcher
  launcher:
    plugin: dump
    source: snap/launcher
    organize:
      mistral-desktop: bin/mistral-desktop